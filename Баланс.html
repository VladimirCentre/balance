<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Баланс</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#86868b;--ac:#0a84ff;--g:#34c759;--r:#ff3b30;--ln:#e5e5ea;--sb:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#8e8e93;--ln:#38383a;--sb:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding-bottom:90px}
#v{max-width:480px;margin:0 auto;padding:16px}
h2{font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;margin-top:8px}
.btn.s{background:var(--ln);color:var(--tx)}
.btn.d{background:var(--r)}
.f{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx);margin:4px 0}
label{font-size:13px;color:var(--mu);display:block;margin-top:10px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ch button{background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;font-size:14px;color:var(--tx)}
.ch button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sg{display:flex;background:var(--ln);border-radius:10px;padding:2px;margin:8px 0}
.sg button{flex:1;border:0;background:0;padding:8px;border-radius:8px;font-size:15px;color:var(--tx)}
.sg button.on{background:var(--card);font-weight:600}
.big{font-size:32px;font-weight:700;text-align:center;border:0;background:0;width:100%;color:var(--tx);outline:0}
.r{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.r:last-child{border:0}
.ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px}
.rt{flex:1}
.rt b{display:block}
.rt small{color:var(--mu)}
.am{font-weight:600}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.ac{min-width:140px;background:var(--card);border-radius:16px;padding:14px;flex-shrink:0}
.ac.hide{opacity:.55}
.pay-card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--ln);margin:12px 0}
.pay-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.pay-item:last-child{border:0}
.need{color:var(--r);font-weight:600}
.ok{color:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sb);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 0 20px;z-index:10}
nav button{background:0;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#sh{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
.bars{display:flex;align-items:flex-end;height:100px;gap:4px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center}
.bp{width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:80px}
.bp i{display:block;width:100%;border-radius:3px 3px 0 0}
.em{text-align:center;color:var(--mu);padding:30px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{padding:8px 0;border-radius:8px;font-size:14px}
.cal .on{background:var(--ac);color:#fff}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 0;color:var(--tx);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.qa span{font-size:22px}
</style>
</head>
<body>
<div id="v"></div>
<nav id="nv"></nav>
<div id="ov"><div id="sh"></div></div>
<script>
const K='fin1',$=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
let S={acc:[{id:1,name:'Карта',type:'💳',bal:0,hide:false},{id:2,name:'Наличные',type:'💵',bal:0,hide:false}],tx:[]};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
S.sh=S.sh||[];S.or=S.or||[];S.set=S.set||{};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
function ensureTaxiCash(){
  if(!S.acc.find(a=>a.taxiCash)){
    const id=uid();
    S.acc.push({id,name:'Наличка такси',type:'💵',bal:0,hide:true,taxiCash:true});
    S.tcId=id;
  } else {
    const e=S.acc.find(a=>a.taxiCash);
    if(e) S.tcId=e.id;
  }
}
function ensureEnvelope(){
  if(!S.acc.find(a=>a.envelope)){
    const id=uid();
    S.acc.push({id,name:'На платежи',type:'📦',bal:0,hide:true,envelope:true});
    S.envId=id;
  } else {
    const e=S.acc.find(a=>a.envelope);
    if(e) S.envId=e.id;
  }
}
ensureEnvelope();ensureTaxiCash();
S.pay=S.pay||[
  {id:1,name:'Машина (аренда)',amount:300,type:'weekly',day:1,note:'Каждый понедельник'},
  {id:2,name:'Квартира',amount:500,type:'monthly',day:26,note:'26 числа'},
  {id:3,name:'Коммунальные',amount:185,type:'monthly',day:24,note:'24-25 числа'},
  {id:4,name:'Кредит',amount:70,type:'monthly',day:21,note:'До 21 числа'}
];
S.acc.forEach(a=>{if(a.hide===undefined)a.hide=false});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
S.EC=S.EC||{'Еда':'🛒','Транспорт':'🚕','Дом':'🏠','Кафе':'☕','Здоровье':'💊','Развлечения':'🎮','Покупки':'🛍','Связь':'📱','Другое':'📦'};
S.IC=S.IC||{'Зарплата':'💼','Подработка':'⚡','Подарок':'🎁','Прочее':'💰'};
const EC=S.EC, IC=S.IC;
const TE={'Бензин':'⛽','Газ':'🔥','Аренда авто':'🚗','Авто: другое':'📦'},TI={'Такси: карта':'💳','Такси: наличные':'💵','Такси: чаевые':'🙏'};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const money=n=> (n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' Br';
const num=s=>parseFloat(String(s||'').replace(',','.'))||0;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bal=a=>a.bal+(S.tx||[]).reduce((s,t)=>{if(t.a==a.id)return s+(t.t=='i'?t.m:t.t=='e'?-t.m:0);if(t.to==a.id&&t.t=='t')return s+t.m;return s},0);
const hrs=(a,b)=>{if(!a||!b)return 0;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);let h=(bh*60+bm)-(ah*60+am);if(h<0)h+=1440;return +(h/60).toFixed(1)};
const dl=d=>{const t=today(),y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+p2(y.getMonth()+1)+'-'+p2(y.getDate());return d==t?'Сегодня':d==ys?'Вчера':new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})};
const grp=arr=>{const g={};arr.forEach(t=>{(g[t.d]=g[t.d]||[]).push(t)});return Object.keys(g).sort().reverse().map(d=>`<div class="card"><small style="color:var(--mu)">${dl(d)}</small>${g[d].map(t=>`<div class="r" onclick="delTx(${t.id})"><div class="ic">${t.t=='i'?'💰':t.t=='e'?'🛒':'🔄'}</div><div class="rt"><b>${esc(t.c||'Перевод')}</b><small>${t.n||''}</small></div><span class="am" style="color:${t.t=='e'?'var(--r)':'inherit'}">${t.t=='e'?'-':''}${money(t.m)}</span></div>`).join('')}</div>`).join('')};
const srt=a=>[...a].sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);
let tab='ops',TK='карта',TC='Бензин',QM='';
function upcomingPayments(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const result=[];
  (S.pay||[]).forEach(p=>{
    let nextDate=null;
    if(p.type==='weekly'){
      const day=now.getDay();
      let add=(1-day+7)%7;
      if(add===0) add=7;
      nextDate=new Date(y,m,d+add);
    } else if(p.type==='monthly'){
      nextDate=new Date(y,m,p.day);
      if(nextDate<=now) nextDate=new Date(y,m+1,p.day);
    }
    if(nextDate){
      const daysLeft=Math.ceil((nextDate-now)/(1000*60*60*24));
      result.push({...p, next:nextDate, daysLeft});
    }
  });
  return result.sort((a,b)=>a.next-b.next);
}
function spendFromEnv(payId, defaultAmount){
  const env=S.acc.find(a=>a.envelope);
  if(!env){alert('Конверт не найден');return}
  const p=S.pay.find(x=>x.id==payId);
  const input=prompt('Сумма к списанию (примерно '+defaultAmount+'):', defaultAmount);
  if(!input)return;
  const amount=num(input);
  if(!(amount>0)){alert('Некорректная сумма');return}
  if(bal(env)<amount){alert('В конверте недостаточно денег');return}
  if(!confirm('Списать '+money(amount)+' на «'+(p?p.name:'платёж')+'»?'))return;
  addT('e', env.id, amount, p?p.name:'Платёж');
  save();render();
}
function freeMoney(){
  return S.acc.filter(a=>!a.hide && a.id!==S.yid && !a.envelope && !a.taxiCash).reduce((s,a)=>s+bal(a),0);
}
const V={
home(){
  const visible=S.acc.filter(a=>!a.hide && a.id!==S.yid && !a.envelope && !a.taxiCash);
  const all=S.acc.filter(a=>a.id!==S.yid && !a.envelope && !a.taxiCash);
  const tot=visible.reduce((s,a)=>s+bal(a),0);
  const totAll=all.reduce((s,a)=>s+bal(a),0);
  const m=today().slice(0,7);
  const inc=S.tx.filter(t=>t.t=='i'&&t.d.startsWith(m)).reduce((s,t)=>s+t.m,0);
  const exp=S.tx.filter(t=>t.t=='e'&&t.d.startsWith(m)).reduce((s,t)=>s+t.m,0);
  return `<div class="card" style="background:linear-gradient(135deg,#1a5c4a,#2d8a6e);color:#fff;padding:20px">
    <small>Общий баланс</small><div style="font-size:36px;font-weight:700">${money(tot)}</div>
    <div style="display:flex;gap:16px;margin-top:12px"><div><small>Доходы за месяц</small><b>${money(inc)}</b></div><div><small>Расходы за месяц</small><b>${money(exp)}</b></div></div>
  </div>
  <div style="text-align:center;color:var(--mu);font-size:13px;margin:4px 0 12px">Всего (включая скрытые): ${money(totAll)}</div>
  <h2>Счета</h2><div class="scroll">${S.acc.filter(a=>a.id!==S.yid || a.envelope).map(a=>`<div class="ac ${a.hide?'hide':''}" onclick="accSheet(${a.id})"><span>${a.type}</span><small>${esc(a.name)}${a.hide?' 👁‍':''}</small><b>${money(bal(a))}</b></div>`).join('')}</div>
  <h2>Обязательные платежи</h2>
  <div class="pay-card">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:15px"><span>В конверте «На платежи»</span><b style="font-size:17px">${money(bal(S.acc.find(a=>a.envelope)||{bal:0}))}</b></div>
    ${(()=>{
      let left=bal(S.acc.find(a=>a.envelope)||{bal:0});
      return upcomingPayments().slice(0,5).map(p=>{
        const covered=left>=p.amount;
        if(covered) left-=p.amount;
        return `<div class="pay-item"><div><b>${esc(p.name)}</b><small style="display:block;color:var(--mu)">${p.note} · через ${p.daysLeft} дн.</small></div><div style="text-align:right"><span class="${covered?'ok':'need'}">${money(p.amount)}</span><br><button class="btn s" style="padding:6px 10px;font-size:12px;margin-top:4px" onclick="spendFromEnv(${p.id},${p.amount})">Списать</button></div></div>`;
      }).join('');
    })()}
    <div style="margin-top:10px;font-size:13px;color:var(--mu)">Нужно ещё отложить: <b class="need">${money(Math.max(0, upcomingPayments().reduce((s,p)=>s+p.amount,0) - bal(S.acc.find(a=>a.envelope)||{bal:0})))}</b></div>
  </div>
  <h2>Последние операции</h2>${grp(srt(S.tx).slice(0,8))}`
},
ops(){
  return `<div class="sg"><button class="${tab=='ops'?'on':''}" onclick="tab='ops';render()">Список</button><button class="${tab=='stats'?'on':''}" onclick="tab='stats';render()">Анализ</button></div>`+
  (tab=='ops'?grp(srt(S.tx)):stats())
},
stats(){
  const ms=[...new Set(S.tx.map(t=>t.d.slice(0,7)))].sort().slice(-6);
  const sum=(m,t)=>S.tx.filter(x=>x.d.startsWith(m)&&x.t==t).reduce((s,x)=>s+x.m,0);
  const mx=Math.max(1,...ms.map(m=>Math.max(sum(m,'i'),sum(m,'e'))));
  return `<h2>Текущая неделя</h2><div class="card">${weekChart()}</div>
  <h2>Доходы и расходы · 6 месяцев</h2><div class="card"><div class="bars">${ms.map(m=>`<div class="bc"><div class="bp"><i style="height:${sum(m,'i')/mx*100}%;background:var(--g)"></i><i style="height:${sum(m,'e')/mx*100}%;background:var(--r)"></i></div><small>${new Date(m+'-01T12:00').toLocaleDateString('ru-RU',{month:'short'}).replace('.','')}</small></div>`).join('')}</div></div>`
},
acc(){setTimeout(popCats,0);return `<h2>Мои счета</h2><div class="card">${S.acc.filter(a=>a.id!==S.yid || a.envelope).map(a=>`<div class="r" onclick="accSheet(${a.id})"><div class="ic">${a.type}</div><div class="rt"><b>${esc(a.name)}${a.hide?' (скрыт)':''}</b></div><span class="am">${money(bal(a))}</span></div>`).join('')}</div><button class="btn" onclick="accSheet()">+ Новый счёт</button>
<h2>Категории</h2>
<div class="card" style="padding:12px">
  <small>Расходы</small>
  <div class="ch" id="ecBtns"></div>
  <button class="btn s" onclick="addCat('e')">+ Категория расхода</button>
  <small style="margin-top:12px;display:block">Доходы</small>
  <div class="ch" id="icBtns"></div>
  <button class="btn s" onclick="addCat('i')">+ Категория дохода</button>
</div>
<h2>Звук и вибрация</h2><div class="sg"><button class="${S.set.snd===0?'':'on'}" onclick="tg('snd')">Звук</button><button class="${S.set.vib===0?'':'on'}" onclick="tg('vib')">Вибрация</button></div><h2>Данные</h2><button class="btn s" onclick="bk()">Скопировать резервную копию</button><button class="btn s" onclick="rs()">Восстановить из копии</button>`}};
function weekChart(){
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const now=new Date();
  const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));
  let html='<div class="bars" style="height:120px">';
  let max=1;
  const data=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    const ds=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
    const inc=S.tx.filter(t=>t.t=='i'&&t.d===ds).reduce((s,t)=>s+t.m,0);
    const exp=S.tx.filter(t=>t.t=='e'&&t.d===ds).reduce((s,t)=>s+t.m,0);
    data.push({inc,exp,day:days[i]});
    max=Math.max(max,inc,exp);
  }
  data.forEach(x=>{
    html+=`<div class="bc"><div class="bp"><i style="height:${x.inc/max*100}%;background:var(--g)"></i><i style="height:${x.exp/max*100}%;background:var(--r)"></i></div><small>${x.day}</small></div>`;
  });
  return html+'</div>';
}
let F={};
function newTx(){F={t:'e',c:'',m:'',n:'',d:today(),a:S.acc[0].id,to:(S.acc[1]||S.acc[0]).id};txSheet(); setTimeout(()=>{if($('#am'))$('#am').value=''},50)}
function txSheet(t){grab();if(t&&t!=F.t){F.t=t;F.c=''}
  const cs=F.t=='e'?EC:IC,opt=v=>S.acc.filter(a=>a.id!==S.yid || a.envelope).map(a=>`<option value="${a.id}" ${a.id==v?'selected':''}>${a.type} ${esc(a.name)}</option>`).join('');
  sheet(`<div class="sg"><button class="${F.t=='e'?'on':''}" onclick="txSheet('e')">Расход</button><button class="${F.t=='i'?'on':''}" onclick="txSheet('i')">Доход</button><button class="${F.t=='t'?'on':''}" onclick="txSheet('t')">Перевод</button></div>
  ${F.t!='t'?`<div class="ch">${Object.keys(cs).map(k=>`<button class="${F.c==k?'on':''}" onclick="F.c='${k}';txSheet()">${cs[k]} ${k}</button>`).join('')}</div>`:''}
  <input class="big" id="am" inputmode="decimal" placeholder="0" value="${F.m||''}">
  ${F.t!='t'?`<label>Счёт</label><select class="f" id="ac">${opt(F.a)}</select>`:`<label>Со счёта</label><select class="f" id="ac">${opt(F.a)}</select><label>На счёт</label><select class="f" id="to">${opt(F.to)}</select>`}
  <label>Дата</label><input class="f" type="date" id="dt" value="${F.d}">
  <input class="f" id="nt" placeholder="Заметка" value="${esc(F.n||'')}">
  <button class="btn" onclick="saveTx()">Сохранить</button>`)}
function grab(){const a=$('#am'),ac=$('#ac'),to=$('#to'),dt=$('#dt'),nt=$('#nt');if(a)F.m=a.value;if(ac)F.a=+ac.value;if(to)F.to=+to.value;if(dt)F.d=dt.value;if(nt)F.n=nt.value}
function saveTx(){grab();const m=parseFloat(String(F.m).replace(',','.'));if(!(m>0)){$('#am').focus();return}
  if(F.t=='t'){if(F.a==F.to)return;addT('t',F.a,m,'',F.to)}else addT(F.t,F.a,m,F.c,0,F.n);
  save();fb(F.t);closeS();render()}
function addT(t,a,m,c,to,n){S.tx.push({id:uid(),t,a,to:to||0,m,c:c||'',n:n||'',d:F.d||today()})}
function delTx(id){if(confirm('Удалить операцию?')){S.tx=S.tx.filter(t=>t.id!=id);save();render()}}
let AT='💳';
function accSheet(id){const a=S.acc.find(x=>x.id==id);AT=a?a.type:'💳';
  const isY=a&&a.id===S.yid;
  sheet(`<h2 style="margin-top:0">${a?'Счёт':'Новый счёт'}</h2>
  <input class="f" id="an" placeholder="Название" value="${a?esc(a.name):''}" ${isY?'disabled':''}>
  <div class="ch">${['💳','💵','🏦','💰','🪙'].map(e=>`<button class="${AT==e?'on':''}" onclick="AT='${e}';accSheet(${id||0})">${e}</button>`).join('')}</div>
  <input class="f" id="ab" inputmode="decimal" placeholder="Начальный баланс" value="${a?a.bal:''}" ${isY?'disabled':''}>
  ${a&&!isY?`<button class="btn s" onclick="toggleHide(${a.id})">${a.hide?'Показать в общем балансе':'Скрыть из общего баланса'}</button>`:''}
  <button class="btn" onclick="saveAcc(${id||0})">Сохранить</button>${a&&S.acc.filter(x=>x.id!==S.yid).length>1&&!isY?`<button class="btn d" onclick="delAcc(${id})">Удалить счёт</button>`:''}`)}
function toggleHide(id){const a=S.acc.find(x=>x.id==id);if(!a||a.id===S.yid)return;a.hide=!a.hide;save();closeS();render()}
function saveAcc(id){const n=$('#an').value.trim(),b=parseFloat($('#ab').value.replace(',','.'))||0;if(!n){$('#an').focus();return}
if(id){const a=S.acc.find(x=>x.id==id);if(a.id===S.yid)return;a.name=n;a.bal=b;a.type=AT;if(a.hide===undefined)a.hide=false}else S.acc.push({id:uid(),name:n,type:AT,bal:b,hide:false});save();closeS();render()}
function delAcc(id){if(!confirm('Удалить счёт и все его операции?'))return;S.tx=S.tx.filter(t=>t.a!=id&&t.to!=id);S.acc=S.acc.filter(a=>a.id!=id);save();closeS();render()}
function popCats(){
  const ec=document.getElementById('ecBtns'), ic=document.getElementById('icBtns');
  if(!ec||!ic)return;
  ec.innerHTML=Object.keys(S.EC||{}).map(k=>`<button data-type="e" data-key="${esc(k)}">${S.EC[k]||''} ${esc(k)}</button>`).join('');
  ic.innerHTML=Object.keys(S.IC||{}).map(k=>`<button data-type="i" data-key="${esc(k)}">${S.IC[k]||''} ${esc(k)}</button>`).join('');
  [...ec.children,...ic.children].forEach(b=>b.onclick=()=>editCat(b.dataset.type,b.dataset.key));
}
function addCat(type){
  try{
    const name=prompt(type=='e'?'Название категории расхода:':'Название категории дохода:');
    if(!name||!name.trim())return;
    const emoji=prompt('Эмодзи:','📦')||'📦';
    if(type=='e'){S.EC=S.EC||{}; S.EC[name.trim()]=emoji;}
    else {S.IC=S.IC||{}; S.IC[name.trim()]=emoji;}
    save();render();
  }catch(e){alert('Ошибка: '+e.message)}
}
function editCat(type,key){
  const action=prompt('1 - переименовать\\n2 - удалить','1');
  if(action=='2'){
    if(confirm('Удалить категорию «'+key+'»?')){
      if(type=='e') delete S.EC[key]; else delete S.IC[key];
      save();render();
    }
  } else if(action=='1'){
    const newName=prompt('Новое название:',key);
    if(newName&&newName.trim()&&newName!==key){
      const emoji=type=='e'?S.EC[key]:S.IC[key];
      if(type=='e'){delete S.EC[key]; S.EC[newName.trim()]=emoji}
      else {delete S.IC[key]; S.IC[newName.trim()]=emoji}
      save();render();
    }
  }
}
function bk(){prompt('Скопируй текст:',JSON.stringify(S))}
function rs(){const s=prompt('Вставьте резервную копию:');if(!s)return;try{const d=JSON.parse(s);if(!d.acc||!d.tx)throw 0;S=d;S.sh=S.sh||[];S.or=S.or||[];S.set=S.set||{};
S.pay=S.pay||[
  {id:1,name:'Машина (аренда)',amount:300,type:'weekly',day:1,note:'Каждый понедельник'},
  {id:2,name:'Квартира',amount:500,type:'monthly',day:26,note:'26 числа'},
  {id:3,name:'Коммунальные',amount:185,type:'monthly',day:24,note:'24-25 числа'},
  {id:4,name:'Кредит',amount:70,type:'monthly',day:21,note:'До 21 числа'}
];S.acc.forEach(a=>{if(a.hide===undefined)a.hide=false});ensureEnvelope();ensureTaxiCash();save();render()}catch(e){alert('Не удалось прочитать данные')}}
const seg=()=>`<div class="sg" style="margin-top:12px"><button class="${tab=='ops'?'on':''}" onclick="tab='ops';render()">Список</button><button class="${tab=='stats'?'on':''}" onclick="tab='stats';render()">Анализ</button></div>`;
let AC;
const beep=k=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const t=AC.currentTime,f=k=='i'?[660,990]:k=='e'?[520,390]:[600,600],o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(f[0],t);o.frequency.setValueAtTime(f[1],t+.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.32)}catch(e){}};
const hap=()=>{try{if(navigator.vibrate)navigator.vibrate([30,50,30]);else{const l=$('#hp');l.click();setTimeout(()=>l.click(),90)}}catch(e){}};
const fb=k=>{if(S.set.snd!==0)beep(k);if(S.set.vib!==0)hap()};
const tg=k=>{S.set[k]=S.set[k]===0?1:0;save();render();fb('t')};
const cash=()=>S.acc.find(a=>a.type=='💵')||S.acc[0];
const yac=()=>{let a=S.acc.find(x=>x.id==S.yid);if(!a){a={id:uid(),name:'Яндекс',type:'🚕',bal:0,hide:true};S.acc.push(a);S.yid=a.id}else{a.hide=true}return a};
const addInc=(k,m)=>{const y=yac();if(k=='карта')addT('i',y.id,m,'Такси: карта');else addT('i',cash().id,m,k=='наличные'?'Такси: наличные':'Такси: чаевые')};
const pf=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-01'};
function weekChart(){return ''}
const addSh=(d,a,b,orders=0,cash=0,card=0)=>S.sh.push({id:uid(),d:d||today(),s:a,e:b,h:hrs(a,b),orders:+orders||0,cash:+cash||0,card:+card||0,ts:Date.now()});
function shS(date,editId){
  const existing=editId?S.sh.find(x=>x.id==editId):null;
  const d=existing?existing.d:(date||today());
  sheet(`<h2 style="margin-top:0">${existing?'Редактировать смену':'Смена'}</h2>
  <label>Дата</label><input class="f" type="date" id="sd" value="${d}">
  <label>Начало</label><input class="f" type="time" id="s1" value="${existing?existing.s:''}">
  <label>Конец</label><input class="f" type="time" id="s2" value="${existing?existing.e:''}">
  <label>Заказы</label><input class="f" type="number" id="ord" inputmode="numeric" placeholder="0" value="${existing?existing.orders||0:''}">
  <label>Наличные</label><input class="f" type="text" id="cash" inputmode="decimal" placeholder="0" value="${existing?existing.cash||0:''}">
  <label>Карта (Яндекс)</label><input class="f" type="text" id="card" inputmode="decimal" placeholder="0" value="${existing?existing.card||0:''}">
  <button class="btn" onclick="saveShift(${editId||0})">Сохранить</button>`);
}
function saveShift(id){
  const d=$('#sd').value, s1=$('#s1').value, s2=$('#s2').value;
  if(!s1||!s2){alert('Укажите время');return}
  const orders=+$('#ord').value||0, cash=num($('#cash').value)||0, card=num($('#card').value)||0;
  if(id){
    const x=S.sh.find(y=>y.id==id);
    if(x){x.d=d;x.s=s1;x.e=s2;x.h=hrs(s1,s2);x.orders=orders;x.cash=cash;x.card=card}
  }else{
    addSh(d,s1,s2,orders,cash,card);
    if(cash>0) addInc('наличные',cash);
    if(card>0) addInc('карта',card);
    if(orders>0) S.or.push({id:uid(),d:d,n:orders});
  }
  save();closeS();render();
}
function shDay(ds){const shifts=S.sh.filter(x=>x.d===ds);if(!shifts.length){shS(ds);return}sheet(`<h2 style="margin-top:0">${dl(ds)}</h2>`+shifts.map(x=>`<div class="r" onclick="shS(null,${x.id})"><div class="ic">⏱</div><div class="rt"><b>${x.s}–${x.e}</b><small>${x.h} ч · ${x.orders||0} зак.</small></div><span class="am">${(x.cash||0)+(x.card||0)>0?money((x.cash||0)+(x.card||0)):''}</span></div>`).join('')+`<button class="btn" onclick="shS('${ds}')">+ ещё смена</button>`)}
function tiS(){sheet(`<h2 style="margin-top:0">Доход с такси</h2>${chips([['карта','💳 Карта (Яндекс)'],['наличные','💵 Наличные'],['чаевые','🙏 Чаевые']],TK,'TK')}<input class="big" id="ta" inputmode="decimal" placeholder="0"><button class="btn" onclick="const m=num($('#ta').value);if(!(m>0))return;addInc(TK,m);save();fb('i');closeS();render()">Сохранить</button>`)}
function rentS(){sheet(`<h2 style="margin-top:0">Аренда авто</h2><input class="big" id="rm" inputmode="decimal" placeholder="0"><label>Со счёта</label><select class="f" id="rw">${opts(cash().id)}</select><button class="btn" onclick="const m=num($('#rm').value);if(!(m>0))return;addT('e',+$('#rw').value,m,'Аренда авто');save();fb('e');closeS();render()">Сохранить</button>`)}
function teS(){sheet(`<h2 style="margin-top:0">Расход на авто</h2>${chips(Object.keys(TE).map(k=>[k,TE[k]+' '+k]),TC,'TC')}<input class="big" id="tm" inputmode="decimal" placeholder="0"><label>Со счёта</label><select class="f" id="tw">${opts(cash().id)}</select><button class="btn" onclick="const m=num($('#tm').value);if(!(m>0))return;addT('e',+$('#tw').value,m,TC);save();fb('e');closeS();render()">Сохранить</button>`)}
const chips=(arr,cur,key)=>`<div class="ch">${arr.map(([k,l])=>`<button class="${cur==k?'on':''}" onclick="${key}='${k}';${key=='TK'?'tiS':'teS'}()">${l}</button>`).join('')}</div>`;
const opts=(v,ex)=>S.acc.filter(a=>a.id!=ex&&(a.id!==S.yid || a.envelope)).map(a=>`<option value="${a.id}" ${a.id==v?'selected':''}>${a.type} ${esc(a.name)}</option>`).join('');
function wdS(){const y=yac(),av=bal(y);if(!(av>0)){alert('На Яндексе пусто');return}sheet(`<h2 style="margin-top:0">Вывести с Яндекса</h2><p>Доступно: <b>${money(av)}</b></p><input class="big" id="wm" value="${av}"><label>На счёт</label><select class="f" id="wa">${opts(cash().id,y.id)}</select><button class="btn" onclick="doWd()">Вывести</button>`)}
function doWd(){const m=num($('#wm').value),to=+$('#wa').value,y=yac();if(!(m>0)||m>bal(y))return;addT('t',y.id,m,'',to);save();closeS();render()}
function tcMove(dir){
  try{
    const tc=S.acc.find(a=>a.taxiCash);
    if(!tc){alert('Счёт «Наличка такси» не найден. Обнови страницу.');return}
    const others=S.acc.filter(a=>!a.taxiCash && !a.envelope && a.id!==S.yid);
    if(!others.length){alert('Нет других счетов');return}
    let msg=(dir=='in'?'Откуда пополнить?':'Куда вывести?')+'\\n';
    others.forEach((a,i)=> msg += (i+1)+'. '+a.type+' '+a.name+' ('+money(bal(a))+')\\n');
    const choice=prompt(msg);
    if(!choice)return;
    const idx=parseInt(choice)-1;
    if(isNaN(idx)||idx<0||!others[idx]){alert('Неверный номер');return}
    const target=others[idx];
    const max=dir=='out'?bal(tc):bal(target);
    const m=parseFloat(String(prompt('Сумма (макс '+max+'):', max)||'').replace(',','.'));
    if(!(m>0)||m>max){alert('Некорректная сумма');return}
    if(dir=='in') addT('t', target.id, m, '', tc.id);
    else addT('t', tc.id, m, '', target.id);
    save();render();
    alert('Готово');
  }catch(e){alert('Ошибка: '+e.message)}
}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('on')}
function closeS(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target==$('#ov'))closeS()};
function render(){
  const p=location.hash.slice(1)||'home';
  $('#v').innerHTML=V[p]?V[p]():V.home();
  $('#nv').innerHTML=[['home','🏠','Главная'],['ops','☰','Операции'],['','+','',true],['taxi','🚗','Такси'],['acc','💼','Счета']].map(([id,ic,lb,big])=>big?`<button onclick="newTx()" style="background:var(--ac);color:#fff;width:56px;height:56px;border-radius:50%;margin-top:-20px;font-size:28px">+</button>`:`<button class="${p==id?'on':''}" onclick="location.hash='${id}';render()">${ic}<span>${lb}</span></button>`).join('');
  if(p=='taxi') V.taxi();
}
V.taxi=()=>{const s=pf(),X=S.tx.filter(t=>t.k&&t.d>=s),inc=X.filter(t=>t.t=='i'),ex=X.filter(t=>t.t=='e'),I=inc.reduce((a,t)=>a+t.m,0),E=ex.reduce((a,t)=>a+t.m,0),sh=S.sh.filter(x=>x.d>=s),H=sh.reduce((a,x)=>a+x.h,0),O=S.or.filter(x=>x.d>=s).reduce((a,x)=>a+x.n,0),D=new Set(sh.map(x=>x.d)).size;
$('#v').innerHTML=`<div class="card" style="background:linear-gradient(135deg,#1a5c4a,#2d8a6e);color:#fff;padding:16px">
<div style="display:flex;justify-content:space-between"><div><small>Доход</small><b>${money(I)}</b></div><div style="text-align:right"><small>Расходы</small><b>${money(E)}</b></div></div></div>
<h2>Добавить</h2><div class="qa">${[['⏱','Смена','shS()'],['💰','Доход','tiS()'],['⛽','Расход','teS()'],['🚗','Аренда','rentS()']].map(([i,l,f])=>`<button onclick="${f}"><span>${i}</span>${l}</button>`).join('')}</div>
<div class="card" style="margin-top:12px">
<div class="r"><div class="rt"><b>Часов</b></div><span class="am">${H.toFixed(1)}</span></div>
<div class="r"><div class="rt"><b>Дней</b></div><span class="am">${D}</span></div>
<div class="r"><div class="rt"><b>Заказов</b></div><span class="am">${O}</span></div>
<div class="r"><div class="rt"><b>Чистыми в час</b></div><span class="am">${H>0?money((I-E)/H):'—'}</span></div>
<div class="r"><div class="ic">💵</div><div class="rt"><b>Наличные</b></div><span class="am">${money(bal(S.acc.find(a=>a.taxiCash)||{bal:0}))}</span></div>
</div>
<button class="btn" onclick="wdS()">Вывести с Яндекса на счёт</button>
<button class="btn s" onclick="tcMove('in')">Пополнить наличку такси</button>
<button class="btn s" onclick="tcMove('out')">Вывести наличку такси</button>
<button class="btn s" onclick="S.rc=Date.now();save();render()">Сдал чеки (обнулить)</button>
<h2>Календарь смен · ${new Date().toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2>
<div class="card"><div class="cal">${(()=>{let h='';const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();const off=(f+6)%7;for(let i=0;i<off;i++)h+='<div></div>';for(let d=1;d<=days;d++){const ds=y+'-'+p2(m+1)+'-'+p2(d),has=S.sh.some(x=>x.d===ds);h+=`<div class="${has?'on':''}" onclick="shDay('${ds}')">${d}</div>`}return h})()}</div></div>
<h2>Последние смены</h2>${S.sh.length?`<div class="card">${S.sh.slice(-8).reverse().map(x=>`<div class="r" onclick="shS(null,${x.id})"><div class="ic">⏱</div><div class="rt"><b>${x.s}–${x.e}</b><small>${dl(x.d)} · ${x.orders||0} зак.</small></div><span class="am">${x.h} ч</span></div>`).join('')}</div>`:'<div class="em">Смен пока нет</div>'}`;
};
window.onhashchange=render;
render();
</script>
</body>
