<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Баланс">
<title>Баланс</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--tx:#0e1a18;--mu:#788985;--ac:#1f8a7d;--g:#1fa971;--r:#e5484d;--ln:rgba(0,0,0,.07);--in:#eef2f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a100f;--card:#141c1b;--tx:#eef4f2;--mu:#8a9a96;--ac:#37c2a8;--g:#4ade80;--r:#ff6b6b;--ln:rgba(255,255,255,.07);--in:#1c2625;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a100f;--card:#141c1b;--tx:#eef4f2;--mu:#8a9a96;--ac:#37c2a8;--g:#4ade80;--r:#ff6b6b;--ln:rgba(255,255,255,.07);--in:#1c2625;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:8px 16px 120px;max-width:520px;margin:0 auto}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:22px 4px 10px}
small{color:var(--mu);font-size:13px}
.hero{background:radial-gradient(120% 90% at 100% 0,rgba(255,255,255,.22),transparent 55%),linear-gradient(135deg,#23a08f,#0d5560);color:#fff;border-radius:28px;padding:24px 22px;box-shadow:0 14px 34px -12px rgba(15,93,102,.55)}
.hero small{color:rgba(255,255,255,.75)}
.hero h1{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:4px 0 18px}
.hs{display:flex;gap:10px}.hs>div{flex:1;background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px;font-size:12px;color:rgba(255,255,255,.8)}
.hs b{display:block;font-size:16px;color:#fff;margin-top:2px}
.scroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.ac{flex:0 0 150px;background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--ln);position:relative}
.ac.hide{opacity:.55}
.ac span{font-size:22px;margin-bottom:8px}.ac b{font-size:17px;margin-top:2px}
.card{background:var(--card);border-radius:22px;padding:6px 14px;border:1px solid var(--ln)}
.dh{font-size:12px;color:var(--mu);padding:12px 0 2px;font-weight:600}
.r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.card>.r:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;background:var(--in);display:grid;place-items:center;font-size:20px;flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600}.rt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am{font-weight:600;white-space:nowrap}.am.e{color:var(--r)}.am.i{color:var(--g)}
.em{text-align:center;color:var(--mu);padding:30px 0;line-height:1.6}
.mn{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.mn b{text-transform:capitalize;font-size:18px}
.mn button{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:18px;border:1px solid var(--ln)}
.sum{display:flex;gap:10px;margin-bottom:12px}.sum>div{flex:1;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 14px}
.sum b{display:block;font-size:17px;margin-top:2px}
.dn{display:flex;align-items:center;gap:18px;padding:12px 4px}
.dn svg{width:140px;flex:none}.lg{flex:1;font-size:13px}.lg div{display:flex;align-items:center;gap:7px;padding:3px 0}.lg i{width:9px;height:9px;border-radius:50%;flex:none}.lg span{margin-left:auto;color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:14px 4px 0}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bp{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%}.bp i{flex:1;border-radius:6px 6px 2px 2px;min-height:2px}
.bc small{font-size:11px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:600;background:var(--ac);color:#fff;margin-top:12px}
.btn.s{background:var(--in);color:var(--tx)}.btn.d{background:rgba(229,72,77,.14);color:var(--r)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-top:1px solid var(--ln);z-index:10}
nav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:4px 0}
nav button.on{color:var(--ac)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#2bb5a0,#157a7a);color:#fff;justify-self:center;margin-top:-26px;box-shadow:0 10px 22px -6px rgba(21,122,122,.6);justify-content:center}
nav .fab svg{stroke-width:2.4}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}#ov.on{display:flex}
#sh{background:var(--card);width:100%;max-width:520px;margin:0 auto;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.gb{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px;background:var(--mu);opacity:.4}
.sg{display:flex;background:var(--in);border-radius:14px;padding:3px}.sg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mu)}
.sg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.big{width:100%;border:0;background:none;color:var(--tx);font-size:46px;font-weight:700;text-align:center;padding:18px 0 4px;outline:0}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.ch button{border:1.5px solid transparent;background:var(--in);color:var(--tx);border-radius:14px;padding:8px 12px;font-size:14px}
.ch button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.f{width:100%;background:var(--in);border:0;border-radius:14px;padding:13px 14px;font-size:16px;color:var(--tx);margin-top:10px;appearance:none;-webkit-appearance:none;outline:0}
label{display:block;font-size:12px;color:var(--mu);margin:12px 4px -4px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}.st{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;text-align:center}.st b{display:block;font-size:26px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qa button{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 0;color:var(--tx);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}.qa span{font-size:22px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}.card>.kv:last-child{border:0}
textarea.f{min-height:100px;resize:none;font-family:inherit}
.total-all{text-align:center;margin:8px 0 16px;font-size:13px;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:13px;background:var(--in)}
.cal .has{background:var(--ac);color:#fff;font-weight:600}
.cal .today{outline:2px solid var(--ac)}

.pay-card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--ln);margin:12px 0}
.pay-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.pay-item:last-child{border:0}
.need{color:var(--r);font-weight:600}
.ok{color:var(--g)}
</style>
</head>
<body>
<div id="v"></div>
<nav id="nv"></nav>
<div id="ov"><div id="sh"></div></div>
<label id="hp" style="position:fixed;left:-99px;opacity:0;pointer-events:none"><input type="checkbox" switch></label>
<script>
const K='fin1',$=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
let S={acc:[{id:1,name:'Карта',type:'💳',bal:0,hide:false},{id:2,name:'Наличные',type:'💵',bal:0,hide:false}],tx:[]};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
S.sh=S.sh||[];S.or=S.or||[];S.set=S.set||{};
S.pay=S.pay||[
  {id:1,name:'Машина (аренда)',amount:300,type:'weekly',day:1,note:'Каждый понедельник'},
  {id:2,name:'Квартира',amount:500,type:'monthly',day:26,note:'26 числа'},
  {id:3,name:'Коммунальные',amount:185,type:'monthly',day:24,note:'24-25 числа'},
  {id:4,name:'Кредит',amount:70,type:'monthly',day:21,note:'До 21 числа'}
];
S.acc.forEach(a=>{if(a.hide===undefined)a.hide=false});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const EC={'Еда':'🛒','Транспорт':'🚕','Дом':'🏠','Кафе':'☕','Здоровье':'💊','Развлечения':'🎮','Покупки':'🛍','Связь':'📱','Другое':'📦'};
const IC={'Зарплата':'💼','Подработка':'⚡','Подарок':'🎁','Прочее':'💰'};
const TE={'Бензин':'⛽','Газ':'🔥','Аренда авто':'🚗','Авто: другое':'📦'},TI={'Такси: карта':'💳','Такси: наличные':'💵','Такси: чаевые':'🙏'};
const CI={...EC,...IC,...TE,...TI},COL=['#37c2a8','#5b8def','#f5a524','#ff6b6b','#a78bfa','#f472b6','#84cc16','#22d3ee','#94a3b8'];
const money=n=>(n<0?'−':'')+Math.abs(n).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' Br';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);

function ensureEnvelope(){
  if(!S.acc.find(a=>a.envelope)){
    const id=uid();
    S.acc.push({id,name:'На платежи',type:'📦',bal:0,hide:true,envelope:true});
    S.envId=id;
  } else {
    const e=S.acc.find(a=>a.envelope);
    if(e) S.envId=e.id;
  }
}

ensureEnvelope();

const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const bal=a=>S.tx.reduce((s,t)=>t.t=='i'&&t.a==a.id?s+t.m:t.t=='e'&&t.a==a.id?s-t.m:t.t=='t'?s+(t.to==a.id?t.m:0)-(t.a==a.id?t.m:0):s,a.bal);
const sum=(m,k)=>S.tx.filter(t=>t.t==k&&t.d.slice(0,7)==m).reduce((s,t)=>s+t.m,0);
const AN=id=>(S.acc.find(a=>a.id==id)||{name:'—'}).name;
const srt=a=>a.slice().sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);
const dl=d=>{const t=today(),y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+p2(y.getMonth()+1)+'-'+p2(y.getDate());return d==t?'Сегодня':d==ys?'Вчера':new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})};
let tab='home',M=today().slice(0,7);
const mv=k=>{const d=new Date(+M.slice(0,4),+M.slice(5)-1+k,1);M=d.getFullYear()+'-'+p2(d.getMonth()+1);render()};
const ml=m=>new Date(m+'-01T12:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
const row=t=>{const tr=t.t=='t';return `<div class="r" onclick="delSheet(${t.id})"><div class="ic">${tr?'🔁':CI[t.c]||'📦'}</div><div class="rt"><b>${tr?'Перевод':esc(t.c)}</b><small>${tr?AN(t.a)+' → '+AN(t.to):AN(t.a)}${t.n?' · '+esc(t.n):''}</small></div><span class="am ${t.t}">${t.t=='e'?'−':t.t=='i'?'+':''}${money(t.m)}</span></div>`};
const grp=a=>{if(!a.length)return '<div class="em">Пока нет операций<br>Нажмите «+», чтобы добавить</div>';let o='',q='';a.forEach(t=>{if(t.d!=q){q=t.d;o+=`<div class="dh">${dl(t.d)}</div>`}o+=row(t)});return `<div class="card">${o}</div>`};
const mnav=()=>`<div class="mn"><button onclick="mv(-1)">‹</button><b>${ml(M)}</b><button onclick="mv(1)">›</button></div>`;

function upcomingPayments(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const result=[];
  S.pay.forEach(p=>{
    let nextDate=null;
    if(p.type==='weekly'){
      // next Monday
      const day=now.getDay(); // 0=Sun,1=Mon
      let add=(1-day+7)%7;
      if(add===0) add=7;
      nextDate=new Date(y,m,d+add);
    } else if(p.type==='monthly'){
      nextDate=new Date(y,m,p.day);
      if(nextDate<=now) nextDate=new Date(y,m+1,p.day);
    }
    if(nextDate){
      const daysLeft=Math.ceil((nextDate-now)/(1000*60*60*24));
      result.push({...p, next:nextDate, daysLeft});
    }
  });
  return result.sort((a,b)=>a.next-b.next);
}

function spendFromEnv(payId, defaultAmount){
  const env=S.acc.find(a=>a.envelope);
  if(!env){alert('Конверт не найден');return}
  const p=S.pay.find(x=>x.id==payId);
  const input=prompt('Сумма к списанию (примерно '+defaultAmount+'):', defaultAmount);
  if(!input)return;
  const amount=num(input);
  if(!(amount>0)){alert('Некорректная сумма');return}
  if(bal(env)<amount){alert('В конверте недостаточно денег');return}
  if(!confirm('Списать '+money(amount)+' на «'+(p?p.name:'платёж')+'»?'))return;
  addT('e', env.id, amount, p?p.name:'Платёж');
  save();render();
}
function freeMoney(){
  return S.acc.filter(a=>!a.hide && a.id!==S.yid && !a.envelope).reduce((s,a)=>s+bal(a),0);
}
const V={
home(){
  const visible=S.acc.filter(a=>!a.hide && a.id!==S.yid && !a.envelope);
  const all=S.acc.filter(a=>a.id!==S.yid && !a.envelope);
  const tot=visible.reduce((s,a)=>s+bal(a),0);
  const totAll=all.reduce((s,a)=>s+bal(a),0);
  const m=today().slice(0,7);
  return `<div class="hero"><small>Общий баланс</small><h1>${money(tot)}</h1><div class="hs"><div>Доходы за месяц<b>${money(sum(m,'i'))}</b></div><div>Расходы за месяц<b>${money(sum(m,'e'))}</b></div></div></div>
<div class="total-all">Всего (включая скрытые): <b>${money(totAll)}</b></div>
<h2>Счета</h2><div class="scroll">${S.acc.filter(a=>a.id!==S.yid || a.envelope).map(a=>`<div class="ac ${a.hide?'hide':''}" onclick="accSheet(${a.id})"><span>${a.type}</span><small>${esc(a.name)}${a.hide?' 👁‍':''}</small><b>${money(bal(a))}</b></div>`).join('')}</div>
<h2>Обязательные платежи</h2>
<div class="pay-card">
  <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:15px"><span>В конверте «На платежи»</span><b style="font-size:17px">${money(bal(S.acc.find(a=>a.envelope)||{bal:0}))}</b></div>
  ${(()=>{
  let left=bal(S.acc.find(a=>a.envelope)||{bal:0});
  return upcomingPayments().slice(0,5).map(p=>{
    const covered=left>=p.amount;
    if(covered) left-=p.amount;
    return `<div class="pay-item"><div><b>${esc(p.name)}</b><small style="display:block;color:var(--mu)">${p.note} · через ${p.daysLeft} дн.</small></div><div style="text-align:right"><span class="${covered?'ok':'need'}">${money(p.amount)}</span><br><button class="btn s" style="padding:6px 10px;font-size:12px;margin-top:4px" onclick="spendFromEnv(${p.id},${p.amount})">Списать</button></div></div>`;
  }).join('');
})()}
  <div style="margin-top:10px;font-size:13px;color:var(--mu)">Нужно ещё отложить: <b class="need">${money(Math.max(0, upcomingPayments().reduce((s,p)=>s+p.amount,0) - bal(S.acc.find(a=>a.envelope)||{bal:0})))}</b></div>
</div>
<h2>Последние операции</h2>${grp(srt(S.tx).slice(0,8))}`},
ops(){const a=srt(S.tx.filter(t=>t.d.slice(0,7)==M));return seg()+mnav()+`<div class="sum"><div><small>Доходы</small><b style="color:var(--g)">${money(sum(M,'i'))}</b></div><div><small>Расходы</small><b style="color:var(--r)">${money(sum(M,'e'))}</b></div></div>`+grp(a)},
stats(){const c={};S.tx.filter(t=>t.t=='e'&&t.d.slice(0,7)==M).forEach(t=>c[t.c]=(c[t.c]||0)+t.m);
const L=Object.entries(c).sort((a,b)=>b[1]-a[1]),T=L.reduce((s,x)=>s+x[1],0);let off=0;
const dn=T?`<div class="dn"><svg viewBox="0 0 42 42"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--in)" stroke-width="5"/>${L.map(([k,v],i)=>{const q=v/T*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${COL[i%9]}" stroke-width="5" stroke-dasharray="${Math.max(q-.6,.1)} ${100-q+.6}" stroke-dashoffset="${25-off}"/>`;off+=q;return s}).join('')}</svg><div class="lg">${L.map(([k,v],i)=>`<div><i style="background:${COL[i%9]}"></i>${CI[k]||''} ${esc(k)}<span>${Math.round(v/T*100)}%</span></div>`).join('')}</div></div>`:'<div class="em">Нет расходов за этот месяц</div>';
const ms=[];for(let i=5;i>=0;i--){const d=new Date(+M.slice(0,4),+M.slice(5)-1-i,1);ms.push(d.getFullYear()+'-'+p2(d.getMonth()+1))}
const mx=Math.max(1,...ms.map(m=>Math.max(sum(m,'i'),sum(m,'e'))));
return seg()+mnav()+`<div class="sum"><div><small>Расходы</small><b style="color:var(--r)">${money(T)}</b></div><div><small>Баланс месяца</small><b>${money(sum(M,'i')-T)}</b></div></div><h2>Расходы по категориям</h2><div class="card">${dn}</div><h2>Текущая неделя</h2><div class="card">${weekChart()}</div>
<h2>Доходы и расходы · 6 месяцев</h2><div class="card"><div class="bars">${ms.map(m=>`<div class="bc"><div class="bp"><i style="height:${sum(m,'i')/mx*100}%;background:var(--g)"></i><i style="height:${sum(m,'e')/mx*100}%;background:var(--r)"></i></div><small>${new Date(m+'-01T12:00').toLocaleDateString('ru-RU',{month:'short'}).replace('.','')}</small></div>`).join('')}</div></div>`},
acc(){return `<h2>Мои счета</h2><div class="card">${S.acc.filter(a=>a.id!==S.yid || a.envelope).map(a=>`<div class="r" onclick="accSheet(${a.id})"><div class="ic">${a.type}</div><div class="rt"><b>${esc(a.name)}${a.hide?' (скрыт)':''}</b></div><span class="am">${money(bal(a))}</span></div>`).join('')}</div><button class="btn" onclick="accSheet()">+ Новый счёт</button><h2>Звук и вибрация</h2><div class="sg"><button class="${S.set.snd===0?'':'on'}" onclick="tg('snd')">Звук</button><button class="${S.set.vib===0?'':'on'}" onclick="tg('vib')">Вибрация</button></div><h2>Данные</h2><button class="btn s" onclick="bk()">Скопировать резервную копию</button><button class="btn s" onclick="rs()">Восстановить из копии</button>`}};
